<!DOCTYPE html>
<html>
	<head>
	  <!-- Standard Meta -->
	  <meta charset="utf-8" />
	  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
	  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
		<link rel="shortcut icon" href="{{ "images/favicon.ico" | relURL }}" type="image/x-icon">
		<link rel="icon" href="{{ "images/favicon.ico" | relURL }}" type="image/x-icon">

		<meta name="keywords" content="prashish, prashish rajbhandari, prashishh">
		<meta name="author" content="Prashish Rajbhandari">
		{{ if .Params.noindex }}<meta name="robots" content="noindex">{{ end }}

		{{ partial "seo.html" . }}

	  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
		
	  <link href="{{ "css/vendor/semantic.min.css" | relURL }}" rel='stylesheet' type='text/css'>
	  <link href="{{ "css/style.css" | relURL }}?v={{ now.Unix }}" rel='stylesheet' type='text/css'>

		<!-- Prevent white flash on page load for dark mode -->
		<script>
		(function() {
			try {
				var theme = localStorage.getItem('theme');
				if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
					document.documentElement.setAttribute('data-theme', 'dark');
				}
			} catch (e) {}
		})();
		</script>

		<!-- Google tag (gtag.js) GA4 -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-TTN10NJDZS"></script>
		<script>
		  window.dataLayer = window.dataLayer || [];
		  function gtag(){dataLayer.push(arguments);} 
		  gtag('js', new Date());
		  gtag('config', 'G-TTN10NJDZS');
		</script>
  </head>

	<body>
		<!-- Dark Mode Toggle Button -->
		<button class="dark-mode-toggle" id="darkModeToggle" aria-label="Toggle dark mode">
			<span id="toggleIcon">🌙</span>
		</button>
		
		<div class="ui page grid bottompadding">
			<div class="ui one wide column"></div>
			<div class="ui thirteen wide column">
				<div class="ui secondary pointing menu floated left nopadding">
					<a href="{{ "/" | relURL }}" class="header active item">Prashish</a>
					<div href="#" class="item"><span class="subname">optimist, engineer, student of life</span></div>
				</div>
			</div>
			<div class="ui one wide column"></div>
		</div>
