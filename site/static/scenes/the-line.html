const QUOTES = {

const QUOTE_IDS = Object.keys(QUOTES);
let qIdx = 0;

setInterval(() => { if (document.hidden) return; qIdx = (qIdx + 1) % QUOTE_IDS.length; showQuote(QUOTE_IDS[qIdx]); }, 4200);
/* the other courtyards are built a little at a time while the first one runs; a place someone asks for early is finished at once */

{ const later = ORDER.filter((id) => id !== ACTIVE.id); const pump = () => { if (!curBuild) { const id = later.find((x) => !built.has(x)); if (!id) return; curBuild = { id, gen: BUILD[id]() }; } stepBuild(4); setTimeout(pump, 24); }; setTimeout(pump, 1200); }
