function beginBuild(sc) { buildRoot = sc.root; statics.length = 0; building = true; }
function endBuild() {
  building = false;
  const root = buildRoot; root.updateMatrixWorld(true);
  const groups = new Map();
  for (const m of statics) { if (!groups.has(m.material)) groups.set(m.material, []); groups.get(m.material).push(m); }
  for (const [material, list] of groups) {
    if (list.length < 2) continue;
    const geos = list.map((m) => { const g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone(); return g.applyMatrix4(m.matrixWorld); });
    const merged = mergeGeometries(geos, false);
    geos.forEach((g) => g.dispose());
    if (!merged) continue;
    const big = new THREE.Mesh(merged, material);
    big.castShadow = list.some((m) => m.castShadow); big.receiveShadow = true; root.add(big);
    for (const m of list) m.removeFromParent();
  }
}

renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse') return;
  hovered = personAt(e.clientX, e.clientY); renderer.domElement.style.cursor = hovered ? 'pointer' : ''; placeTag();
});
renderer.domElement.addEventListener('pointerleave', () => { hovered = null; placeTag(); });
elLook.addEventListener('click', () => {
  everyoneUp = !everyoneUp;
  if (!everyoneUp) for (const sc of Object.values(SC)) for (const pp of sc.people) pp.forcedUp = false;
  if (everyoneUp) sfx('warm');
  if (!playing && started) { meterT = tileT = -9; update(t, 1 / 60); render(true); }
});
elSnd.addEventListener('click', () => setSound(!AU.on));
function switchScene(id) {
  const n = SC[id];
  if (!n || n === ACTIVE) return;
  if (ACTIVE) { ACTIVE.root.visible = false; hideBubbles(ACTIVE); }
  ACTIVE = n; n.root.visible = true; people = n.people; staff = n.staff; roomWarm = 0; hovered = null; placeTag();
  for (const b of elSeg.querySelectorAll('button')) b.classList.toggle('on', b.dataset.s === id);
  follow(people.find((pp) => pp.name === n.follow) || people[0]);
  tilesKey = ''; meterT = tileT = -9;
  if (AU.ctx) { AU.bedG.gain.setTargetAtTime(0, AU.ctx.currentTime, 0.2); }
  if (started) { layout(); if (!playing) { update(t, 1 / 60); render(true); } }
}
for (const b of elSeg.querySelectorAll('button')) b.addEventListener('click', () => switchScene(b.dataset.s));

/* ---------- run ---------- */
let playing = !reduceMotion && fixedT === null, started = false, onScreen = true, t = 0, last = performance.now();
if (qs.has('play')) playing = true;
for (const sc of Object.values(SC)) for (const pp of sc.people) if (pp.p.root.visible) setAct(pp, isUp(pp) ? 'look' : 'scroll', rnd(0.5, 4), isUp(pp) ? { who: pick(sc.people.filter((o) => o !== pp && o.p.root.visible)) } : {});
switchScene(SC[qs.get('scene')] ? qs.get('scene') : 'restaurant');
if (qs.get('sel')) { const o = people.find((pp) => pp.name.toLowerCase() === qs.get('sel').toLowerCase()); if (o) follow(o); }
scene.updateMatrixWorld(true);
for (const sc of Object.values(SC)) { for (const pp of sc.people) if (pp.p.root.visible) placeProps(pp, 0); for (const s of sc.staff) staffPost(s); }
applyTheme();
layout();
addEventListener('resize', () => { layout(); if (!playing && started) { updateBubbles(); render(true); } });
setInterval(() => {
  try { const fe = window.frameElement; if (fe) { const r = fe.getBoundingClientRect(), vh = window.parent.innerHeight; onScreen = r.bottom > 0 && r.top < vh; } }
  catch (e) { onScreen = true; }
}, 400);
const startAt = fixedT !== null ? fixedT : reduceMotion ? 20 : 0;
prerolling = true;
for (let s = 0; s < startAt; s += 1 / 30) update(s, 1 / 30);
prerolling = false;
t = startAt; update(t, 1 / 60); render(true);
started = true; note.hidden = true; document.body.classList.add('ready'); window.__sceneStarted = true;
window.__scene = { SC, get people() { return people; }, get now() { return now; }, get sel() { return sel.name; }, camera, AU, sfx, SFX, switchScene, TR, BD, step(sec) { for (let i = 0; i < sec * 60; i++) { t += 1 / 60; update(t, 1 / 60); } render(true); } };
if (document.fonts) document.fonts.load('600 46px "Caveat"', 'Tonight').then(() => { drawMenu(); if (!playing && started) render(true); }).catch(() => {});
if (reduceMotion && fixedT === null) elPlay.hidden = false;
elPlay.addEventListener('click', () => { playing = true; elPlay.hidden = true; last = performance.now(); });
function frame(ms) {
  const dt = Math.min(0.05, (ms - last) / 1000); last = ms;
  const active = playing && onScreen && !document.hidden;
  if (AU.ctx && active !== AU.active) { AU.active = active; if (AU.on) { if (active) AU.ctx.resume(); else AU.ctx.suspend(); } }
  if (active) {
    t += dt; placeCamera(camDist, Math.sin(t * 0.13) * 0.035); update(t, dt); render(false);
    if (hovered) placeTag();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
