  for (const m of statics) { if (!groups.has(m.material)) groups.set(m.material, []); groups.get(m.material).push(m); }

})();

function updateBeam(t, a, b, vis, steady) {
  curve.v0.copy(a); curve.v2.copy(b);
  const dist = a.distanceTo(b);
  curve.v1.copy(a).add(b).multiplyScalar(0.5); curve.v1.y += 0.18 + dist * 0.16;
  tube.geometry.dispose();
  tube.geometry = new THREE.TubeGeometry(curve, 28, 0.013 + 0.008 * steady, 6, false);
  tube.material.opacity = 0.55 * vis; tube.visible = vis > 0.03;
  const speed = 0.85 - 0.35 * steady;
  for (let i = 0; i < N_PART; i++) {
    const u = (t * speed + i / N_PART) % 1;
    curve.getPoint(u, tmpP); dummy.position.copy(tmpP);
    dummy.scale.setScalar(vis * (1 + 0.45 * steady) * Math.sin(Math.PI * u) + 1e-4);
    dummy.updateMatrix(); parts.setMatrixAt(i, dummy.matrix);
  }
  parts.instanceMatrix.needsUpdate = true; parts.visible = vis > 0.03;
}

      const dd = (lo + hi) / 2; placeCamera(dd);
      let ok = true;
      for (const c of corners) { tmpP.copy(c).project(camera); if (Math.abs(tmpP.x) > 0.97 || tmpP.y > 0.84 || tmpP.y < -0.97) { ok = false; break; } }

    for (const c of corners) { tmpP.copy(c).project(camera); x0 = Math.min(x0, tmpP.x); x1 = Math.max(x1, tmpP.x); y0 = Math.min(y0, tmpP.y); y1 = Math.max(y1, tmpP.y); }

}
function layout() {

  insetR = { x: W - 14 - iw, y: 14, w: iw, h: ih };

let frameNo = 0;

  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, innerWidth, innerHeight);
  renderer.setClearColor(0x000000, 0);
  renderer.render(scene, camera);
  renderer.setScissorTest(true);
  renderer.setScissor(insetR.x, insetR.y, insetR.w, insetR.h);
  renderer.setViewport(insetR.x, insetR.y, insetR.w, insetR.h);

  renderer.setScissorTest(false);

function isDark() { const a = document.documentElement.getAttribute('data-theme'); return a ? a === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function applyTheme() {
  const dk = isDark();
  gridMat.uniforms.uColor.value.set(dk ? '#9d8bd8' : '#a69481'); gridMat.uniforms.uOpacity.value = dk ? 0.22 : 0.16;
  catcher.material.opacity = dk ? 0.34 : 0.2;
  insetBg.set(dk ? '#1c1726' : '#efe6d9');
  if (!playing && started) render(true);
}
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
const mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', applyTheme);

/* ---------- tap a student to follow them ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); ray.layers.set(2);
function studentAt(x, y) {
  if (x > innerWidth - 18 - insetR.w && y > innerHeight - 18 - insetR.h) return null;
  ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(picks, false); return h.length ? h[0].object.userData.st : null;
}
function placeTag() {
  if (!hovered) { elTag.classList.remove('on'); return; }
  proj.copy(hovered.head); proj.y -= 0.34; proj.project(camera);
  elTag.textContent = hovered.name;
  elTag.style.transform = 'translate(' + ((proj.x + 1) * 0.5 * innerWidth).toFixed(1) + 'px,' + ((1 - proj.y) * 0.5 * innerHeight).toFixed(1) + 'px) translate(-50%,0)';
  elTag.classList.add('on');
}
function insetLabel() { elInsetLabel.textContent = (innerWidth < 440 ? '' : 'Through ') + sel.name + '’s eyes'; }
function select(st) {
  if (st) elTip.classList.add('gone');
  if (!st || st === sel) return;
  setLayer(sel, 0); sel = st; setLayer(sel, 1);
  attnInit = false; lastLabel = ''; lastCount = -1; countT = -9; lastBtn = null;
  elName.textContent = st.name; insetLabel();
  elTip.classList.add('gone');
  if (!playing && started) { update(t, 1 / 60); render(true); }
}
renderer.domElement.addEventListener('click', (e) => select(studentAt(e.clientX, e.clientY)));
renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse') return;
  hovered = studentAt(e.clientX, e.clientY); renderer.domElement.style.cursor = hovered ? 'pointer' : ''; placeTag();
});
renderer.domElement.addEventListener('pointerleave', () => { hovered = null; placeTag(); });
elSnd.addEventListener('click', () => setSound(!AU.on));
elFocus.addEventListener('click', () => {
  const s = sel;
  if (s.locked) return;
  if (s.focused) { s.focused = false; s.act.until = Math.min(s.act.until, now + rnd(0.4, 1.2)); }
  else { s.focused = true; s.locked = true; setAct(s, 'putAway', 0.9); }
  lastBtn = null;
  if (!playing && started) { update(t, 1 / 60); render(true); }
});

/* ---------- run ---------- */
let playing = !reduceMotion && fixedT === null, started = false, onScreen = true, t = 0, last = performance.now();
if (qs.has('play')) playing = true;
sel = students.find((s) => s.name.toLowerCase() === (qs.get('sel') || 'lucas').toLowerCase()) || students[0];
fillSlot(0, 'target', 1); fillSlot(3, 'word', 1);
for (const st of students) setAct(st, 'listen', rnd(0.5, 4) + st.focus * 6);
scene.updateMatrixWorld(true);
for (const st of students) { placeProps(st, 0); st.log.length = 0; }
teacher.head.getWorldPosition(tHead);
setLayer(sel, 1); elName.textContent = sel.name;
elTip.textContent = (matchMedia('(pointer: coarse)').matches ? 'Tap' : 'Click') + ' any student to follow their attention';
applyTheme();
layout();
addEventListener('resize', () => { layout(); if (!playing && started) { updateBubbles(); drawMonitor(); render(true); } });
setInterval(() => {
  try { const fe = window.frameElement; if (fe) { const r = fe.getBoundingClientRect(), vh = window.parent.innerHeight; onScreen = r.bottom > 0 && r.top < vh; } }
  catch (e) { onScreen = true; }
}, 400);
const startAt = fixedT !== null ? fixedT : reduceMotion ? 24 : 0;
prerolling = true;
for (let s = 0; s < startAt; s += 1 / 30) update(s, 1 / 30);
prerolling = false;
t = startAt; update(t, 1 / 60); drawBoard(); render(true);
started = true; note.hidden = true; document.body.classList.add('ready'); window.__sceneStarted = true;
window.__scene = { students, select: (n) => select(students.find((s) => s.name === n)), get sel() { return sel.name; }, get now() { return now; }, get ev() { return ev && ev.kind; }, plane, camera, AU, sfx, step(sec) { for (let i = 0; i < sec * 60; i++) { t += 1 / 60; update(t, 1 / 60); } render(true); } };
if (document.fonts) document.fonts.load('600 116px "Caveat"', 'Focus').then(() => { drawBoard(); drawCamera(); if (!playing && started) render(true); }).catch(() => {});
if (reduceMotion && fixedT === null) elPlay.hidden = false;
elPlay.addEventListener('click', () => { playing = true; elPlay.hidden = true; last = performance.now(); });
function frame(ms) {
  const dt = Math.min(0.05, (ms - last) / 1000); last = ms;
  const active = playing && onScreen && !document.hidden;
  if (AU.ctx && active !== AU.active) { AU.active = active; if (AU.on) { if (active) AU.ctx.resume(); else AU.ctx.suspend(); } }
  if (active) {
    t += dt; placeCamera(camDist, Math.sin(t * 0.13) * 0.035); update(t, dt); render(false);
    if (hovered) placeTag();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
